name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      TESTCONTAINERS_CHECKS_DISABLE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set CI Compose env
        run: echo "POSTGRES_PASSWORD=ci-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify (unit + integration)
        run: ./gradlew check --no-daemon --stacktrace

      - name: Verify Docker Compose config
        run: docker compose config

      - name: Smoke Docker Compose stack
        run: |
          docker compose up -d --build
          docker compose ps
          timeout 120 bash -c 'until curl -fsS http://localhost:8080/actuator/health; do sleep 5; done'

      - name: Dump API logs
        if: always()
        run: docker compose logs --no-color api

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
